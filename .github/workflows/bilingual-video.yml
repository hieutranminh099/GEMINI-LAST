name: Android bilingual video verification
on:
  workflow_dispatch:
  push:
    branches: [codex-dev, codex/final-android-stabilization]
permissions:
  contents: read
jobs:
  android-instrumentation:
    name: Android instrumentation (${{ matrix.suite }})
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/codex/final-android-stabilization' || contains(github.event.head_commit.message, '[verify-bilingual]')
    strategy:
      fail-fast: false
      matrix:
        suite: [technical, gemini-quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare the synthetic Mandarin fixture tools
        run: |
          echo "VERIFICATION_EVIDENCE=$RUNNER_TEMP/bilingual-evidence.txt" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg fonts-noto-cjk
          python scripts/setup_android_asr.py
      - name: Start isolated Android
        timeout-minutes: 12
        run: |
          set -euo pipefail
          sudo chmod a+rw /dev/kvm
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/bilingual-avds"
          mkdir -p "$ANDROID_AVD_HOME"
          image='system-images;android-34;google_apis;x86_64'
          sdkmanager --sdk_root="$ANDROID_HOME" --install 'emulator' "$image"
          avdmanager create avd --name bilingual --package "$image" --device pixel_2 --path "$ANDROID_AVD_HOME/bilingual.avd" <<< no
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx bilingual
          df -h "$ANDROID_AVD_HOME"
          adb start-server
          "$ANDROID_HOME/emulator/emulator" -avd bilingual -accel on -no-window -no-snapshot -no-audio -no-boot-anim \
            -gpu swiftshader -cores 2 -memory 3072 -partition-size 2560 > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator_pid=$!
          deadline=$((SECONDS + 300))
          until [[ $(timeout 5 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true) == 1 ]]; do
            if ! kill -0 "$emulator_pid" 2>/dev/null || (( SECONDS >= deadline )); then
              adb devices -l
              tail -70 "$RUNNER_TEMP/emulator.log"
              exit 1
            fi
            sleep 3
          done
          adb shell svc power stayon true
          adb shell input keyevent 82
      - name: Build both disposable APKs
        working-directory: android-app
        run: bash gradlew -PverificationAppId=com.gemini.ocr.bilingualtest :app:assembleDebug :app:assembleDebugAndroidTest --max-workers=2
      - name: Install verification app and instrumentation
        id: install
        run: |
          adb install -t android-app/app/build/outputs/apk/debug/app-debug.apk
          adb install -t android-app/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - name: Check native media export and Android Keystore recovery with controlled translations
        if: matrix.suite == 'technical'
        run: bash scripts/verify_bilingual_android.sh fixture
      - name: Exercise live translation, export and clean installation key recovery
        if: matrix.suite == 'gemini-quality'
        env:
          GEMINI_BENCHMARK_API_KEY: ${{ secrets.GEMINI_BENCHMARK_API_KEY }}
        run: bash scripts/verify_bilingual_android.sh gemini
      - name: Score VI and EN contextual excerpt translations and record Gemini timings
        if: ${{ !cancelled() && matrix.suite == 'gemini-quality' && steps.install.outcome == 'success' }}
        env:
          GEMINI_BENCHMARK_API_KEY: ${{ secrets.GEMINI_BENCHMARK_API_KEY }}
        run: bash scripts/verify_bilingual_android.sh quality
      - name: Upload sanitized bilingual integration evidence
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: bilingual-${{ matrix.suite }}-evidence
          path: ${{ env.VERIFICATION_EVIDENCE }}
      - name: Build and install network-disabled stability APKs
        id: stability
        if: ${{ !cancelled() && matrix.suite == 'technical' && steps.install.outcome == 'success' }}
        run: |
          (cd android-app && bash gradlew -PverificationAppId=com.gemini.ocr.codexbench -PverificationOffline=true :app:assembleDebug :app:assembleDebugAndroidTest --max-workers=2)
          adb install -t android-app/app/build/outputs/apk/debug/app-debug.apk
          adb install -t android-app/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - name: Edit and merge bilingual cues and reopen the long project
        if: ${{ !cancelled() && steps.stability.outcome == 'success' }}
        run: bash scripts/verify_android_video_stability.sh edits
      - name: Force-stop Android and recover the interrupted project
        if: ${{ !cancelled() && steps.stability.outcome == 'success' }}
        run: bash scripts/verify_android_video_stability.sh interruption
      - name: Pause and resume a 36-minute synthetic video with native OCR
        if: ${{ !cancelled() && steps.stability.outcome == 'success' }}
        run: bash scripts/verify_android_video_stability.sh long

  android-checks:
    name: Android unit tests, lint and debug APK
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/codex/final-android-stabilization' || contains(github.event.head_commit.message, '[verify-bilingual]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare the Android speech runtime
        run: python scripts/setup_android_asr.py
      - name: Build the standard debug APK
        working-directory: android-app
        run: bash gradlew :app:assembleDebug --max-workers=2
      - name: Verify debug APK signature and record SHA-256
        id: debug-apk
        run: |
          set -euo pipefail
          apk=android-app/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          mkdir -p "$RUNNER_TEMP/debug-apk"
          cp "$apk" "$RUNNER_TEMP/debug-apk/"
          (cd "$RUNNER_TEMP/debug-apk" && sha256sum app-debug.apk > SHA256SUMS.txt)
      - name: Publish the debug APK and checksum
        if: steps.debug-apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: gemini-last-debug-apk
          path: ${{ runner.temp }}/debug-apk/
      - name: Run Android JVM tests
        if: ${{ !cancelled() }}
        working-directory: android-app
        run: bash gradlew :app:testDebugUnitTest --max-workers=2
      - name: Run Android Lint
        if: ${{ !cancelled() }}
        working-directory: android-app
        run: bash gradlew :app:lintDebug --max-workers=2
      - name: Check internal document links
        if: ${{ !cancelled() }}
        run: python scripts/check_codex_docs.py
      - name: Upload Android unit and lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-lint
          path: |
            android-app/app/build/test-results/testDebugUnitTest/*.xml
            android-app/app/build/reports/lint-results-debug.xml

  windows-tests:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/codex/final-android-stabilization' || contains(github.event.head_commit.message, '[verify-bilingual]')
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Companion tests with Windows DPAPI
        run: |
          python -m pip install pytest pytest-asyncio fastapi==0.115.12 uvicorn==0.34.2 "websockets>=14,<18" httpx==0.28.1 cryptography==44.0.3 qrcode==8.2 python-multipart==0.0.22 pillow psutil numpy
          python -m pytest tests -q
