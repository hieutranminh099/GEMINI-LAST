name: Android bilingual video verification
on:
  workflow_dispatch:
  push:
    branches: [codex-dev]
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-bilingual]')
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare the synthetic Mandarin fixture tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg fonts-noto-cjk
          python scripts/setup_android_asr.py
      - name: Start isolated Android
        timeout-minutes: 12
        run: |
          set -euo pipefail
          sudo chmod a+rw /dev/kvm
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/bilingual-avds"
          mkdir -p "$ANDROID_AVD_HOME"
          image='system-images;android-34;google_apis;x86_64'
          sdkmanager --sdk_root="$ANDROID_HOME" --install 'emulator' "$image"
          avdmanager create avd --name bilingual --package "$image" --device pixel_2 --path "$ANDROID_AVD_HOME/bilingual.avd" <<< no
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx bilingual
          df -h "$ANDROID_AVD_HOME"
          adb start-server
          "$ANDROID_HOME/emulator/emulator" -avd bilingual -accel on -no-window -no-snapshot -no-audio -no-boot-anim \
            -gpu swiftshader -cores 2 -memory 2048 -partition-size 2560 > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator_pid=$!
          deadline=$((SECONDS + 300))
          until [[ $(timeout 5 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true) == 1 ]]; do
            if ! kill -0 "$emulator_pid" 2>/dev/null || (( SECONDS >= deadline )); then
              adb devices -l
              tail -70 "$RUNNER_TEMP/emulator.log"
              exit 1
            fi
            sleep 3
          done
          adb shell svc power stayon true
          adb shell input keyevent 82
      - name: Build both disposable APKs
        working-directory: android-app
        run: bash gradlew -PverificationAppId=com.gemini.ocr.bilingualtest :app:assembleDebug :app:assembleDebugAndroidTest --max-workers=2
      - name: Install verification app and instrumentation
        id: install
        run: |
          adb install -t android-app/app/build/outputs/apk/debug/app-debug.apk
          adb install -t android-app/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - name: Check native media export and Android Keystore recovery with controlled translations
        run: bash scripts/verify_bilingual_android.sh fixture
      - name: Exercise both languages, exports and clean installation key recovery
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          GEMINI_BENCHMARK_API_KEY: ${{ secrets.GEMINI_BENCHMARK_API_KEY }}
        run: bash scripts/verify_bilingual_android.sh gemini

  windows-tests:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-bilingual]')
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Companion tests with Windows DPAPI
        run: |
          python -m pip install pytest pytest-asyncio fastapi==0.115.12 uvicorn==0.34.2 "websockets>=14,<18" httpx==0.28.1 cryptography==44.0.3 qrcode==8.2 python-multipart==0.0.22 pillow psutil numpy
          python -m pytest tests -q
